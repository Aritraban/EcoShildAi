<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Recommendations - EcoShield AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="nav" id="nav"></div>
  <main class="container page">
    <h1>AI Recommendations</h1>
    <p class="muted mb-3">Personalised actions ranked by estimated CO₂e reduction.</p>
    <div id="disclaimer" class="alert alert-ok" style="display:none"></div>
    <div id="list" class="grid cols-2"></div>
    <div id="empty" class="glass card hidden" style="text-align:center;padding:36px">
      <h3>No recommendations yet</h3>
      <p class="muted mt-1">Run a calculation first.</p>
      <a href="calculator.html" class="btn btn-primary mt-2">Open calculator</a>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (UI.requireAuth()) {
      UI.renderNav("recommendations");
      const ICONS = { transportation: "🚗", energy: "⚡", food: "🥗", shopping: "🛍️", waste: "♻️", general: "🌍" };
      function esc(s){ return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }
      (async () => {
        try {
          const data = await API.get("/carbon/recommendations");
          const recs = data.recommendations || [];
          if (!recs.length) { document.getElementById("empty").classList.remove("hidden"); return; }
          document.getElementById("disclaimer").style.display = "block";
          document.getElementById("disclaimer").textContent = "ℹ️ " + data.disclaimer;
          document.getElementById("list").innerHTML = recs.map(r => `
            <div class="glass card">
              <div class="flex between center">
                <span class="badge info">#${r.rank} · ${esc(r.category)}</span>
                <span class="badge ok">~${Number(r.estimated_reduction_kg).toFixed(0)} kg CO₂e/mo</span>
              </div>
              <h3 class="mt-2">${ICONS[r.category]||"🌍"} ${esc(r.title)}</h3>
              <p class="muted mt-1" style="font-size:.92rem">${esc(r.detail)}</p>
            </div>`).join("");
        } catch (e) { console.error(e); }
      })();
    }
  </script>
</body>
</html>
